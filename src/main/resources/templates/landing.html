<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AURA 결과</title>
</head>
<body>

<h1>🔥 AURA 결과</h1>

<p>Session ID: <span id="publicId" th:text="${publicId}"></span></p>

<hr>

<h3>QR</h3>
<img id="qr" width="200"/>

<h3>Landing URL</h3>
<p id="landingUrl"></p>

<h3>Video Status</h3>
<p id="videoStatus"></p>

<script>
    const publicId = document.getElementById("publicId").innerText;

    fetch(`http://localhost:8080/api/landing/${publicId}`)
        .then(res => res.json())
        .then(res => {
            const data = res.data;

            console.log("최종 data:", data);

            document.getElementById("videoStatus").innerText = data.video_status;

            document.getElementById("landingUrl").innerText =
                data.video_url ?? "영상 없음";

            document.getElementById("qr").src =
                data.qr_image_url ?? "https://via.placeholder.com/200";
        });
</script>

</body>
</html>
