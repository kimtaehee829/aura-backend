spring:
  datasource:
    url: jdbc:mysql://localhost:3307/aura
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info

openai:
  api-key: test

aura:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173