spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/aura?serverTimezone=UTC&characterEncoding=UTF-8
    username: aura_app
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info

aura:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173